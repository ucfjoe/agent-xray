name: DSH plugin lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm install --global @deepseek-ai/dsh@0.2.0-rc.2
      - run: XRAY_FIXTURES=1 npm run lab:setup
      - run: XRAY_FIXTURES=1 node scripts/smoke-lab.js
